<svg width="920" height="560" viewBox="0 0 920 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Print Agent health and capability contract</title>
  <rect width="920" height="560" fill="#050505"/>
  <rect x="28" y="28" width="864" height="504" rx="8" stroke="#3f3f46" stroke-width="2"/>
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; letter-spacing: 0; }
    .eyebrow { fill: #f5f5f5; font-size: 15px; font-weight: 800; }
    .title { fill: #ffffff; font-size: 38px; font-weight: 850; }
    .muted { fill: #a1a1aa; font-size: 18px; font-weight: 700; }
    .label { fill: #ffffff; font-size: 15px; font-weight: 850; }
    .code { fill: #f4f4f5; font-family: Consolas, "SFMono-Regular", monospace; font-size: 18px; font-weight: 700; white-space: pre; }
    .sideTitle { fill: #ffffff; font-size: 24px; font-weight: 850; }
    .sideText { fill: #f4f4f5; font-size: 17px; font-weight: 750; }
    .sideHint { fill: #a1a1aa; font-size: 15px; font-weight: 700; }
  </style>
  <text x="58" y="78" class="eyebrow">PRINT AGENT / HEALTH</text>
  <text x="58" y="130" class="title">Health and capabilities</text>
  <text x="60" y="168" class="muted">The POS checks token auth, version, capabilities and printer state.</text>
  <rect x="60" y="218" width="800" height="286" rx="8" stroke="#52525b" stroke-width="2"/>
  <rect x="92" y="248" width="176" height="38" rx="8" stroke="#ffffff" stroke-width="2"/>
  <text x="112" y="273" class="label">GET /health</text>
  <text x="92" y="318" class="code">{</text>
  <text x="112" y="342" class="code">status, agentVersion,</text>
  <text x="112" y="366" class="code">protocolVersion,</text>
  <text x="112" y="390" class="code">capabilities: { receipt, kitchen,</text>
  <text x="132" y="414" class="code">cashDrawer },</text>
  <text x="112" y="438" class="code">printers: { receipt, kitchen,</text>
  <text x="132" y="462" class="code">cash_drawer }</text>
  <text x="92" y="486" class="code">}</text>
  <rect x="606" y="304" width="222" height="148" rx="8" stroke="#ffffff" stroke-width="2"/>
  <text x="628" y="340" class="sideTitle">Auth</text>
  <text x="628" y="374" class="sideText">Bearer token</text>
  <text x="628" y="402" class="sideText">x-print-agent</text>
  <text x="628" y="430" class="sideHint">token header</text>
</svg>
